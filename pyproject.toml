[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-research-corpus"
version = "0.1.0"
description = "Version-controlled Markdown research corpus toolkit with controlled metadata validation, CSV indexing, and cited search."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Zack Alexander" }]
keywords = ["markdown", "research", "corpus", "cli", "ripgrep", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
parsers = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mdcorpus = "mdcorpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
